name: Build

# Every push: test and build the app. A push to main also publishes it as a GitHub release,
# which is what the menu's "Check for updates" and install.sh download.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test
        run: swift test
      - name: Build the app
        run: |
          echo "VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          VERSION="0.1.${{ github.run_number }}" scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ToolMacTool
          path: build/ToolMacTool.zip
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/ToolMacTool.zip --target "$GITHUB_SHA" \
            --title "Tool Mac Tool $VERSION" --notes "$(git log -1 --format=%B)"
