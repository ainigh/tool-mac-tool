});
$('#soundbtn').classList.toggle('off', !GlassSound.on);

/* =========================================================
   look: the glass panel, or a 3D character in its place (glass-character.js), moved by the
   same body: it nods, shrugs, waves, blinks, follows your pointer with its eyes, and its lips
   follow the voice (visemes from glassvoice). The menu floats in a column beside it and the
   rainbow gives way to a clear background. Your own .vrm / .glb is kept in IndexedDB.
   ========================================================= */
let CH = null, lookBusy = null;
const LOOK = { mode: ls.get('look', 'glass'), url: ls.get('char-model-url', ''), name: ls.get('char-model-name', ''),
               builtin: ls.get('char-builtin', 'frog') };
const BUILTINS = { frog: 'the tree frog', glass: 'the glass creature' };
async function charModel(){
  if (LOOK.url) return LOOK.url;
  try{ const f = await kvGet('char-model'); if (f?.blob) return f.blob; }catch{}
  return 'builtin:' + LOOK.builtin;
}
function lookFailed(title, e, quiet){
  const msg = `${e?.message || e}`;
  if (quiet) setStatus(`${title}: ${msg}`, 'err');
  else GlassUI.alert({ title, body: msg });
}
function setLook(mode, {quiet} = {}){
  return lookBusy = (async () => {
    await lookBusy?.catch(() => {});
    const char = mode === 'char';
    LOOK.mode = char ? 'char' : 'glass'; ls.set('look', LOOK.mode);
    $('#lookbtn').classList.toggle('on', char);
    if (!char){ root.classList.remove('char'); CH?.show(false); fitOut(false); return; }
    if (!CH){
      try{ await GlassCharacter.load(); }
      catch(e){
        LOOK.mode = 'glass'; ls.set('look', 'glass'); $('#lookbtn').classList.remove('on');
        return lookFailed('Couldn’t load the 3D character', new Error('three.js didn’t load (the first time it’s fetched from ' +
          'cdn.jsdelivr.net, then the browser keeps it), or this browser has no WebGL. ' + (e?.message || '')), quiet);
      }
      const model = await charModel();
      CH = GlassCharacter.attach($('#char'), { body, model, reduce: REDUCED });
      try{ await CH.ready; }
      catch(e){                                    // your model didn't load: the built-in one instead
        CH.stop(); CH = GlassCharacter.attach($('#char'), { body, reduce: REDUCED });
        lookFailed('Couldn’t load your model, showing the built-in character', e, quiet);
        await CH.ready.catch(err => { CH.stop(); CH = null; throw err; });
      }
    }
    root.classList.add('char'); CH.show(true); fitOut(false);
  })().catch(e => { root.classList.remove('char'); lookFailed('Couldn’t show the character', e, quiet); });
}
function useModel(src, name){
  LOOK.name = name || ''; ls.set('char-model-name', LOOK.name);
  if (!CH) return setLook('char');
  return CH.setModel(src).catch(e => lookFailed('Couldn’t load that model', e));
}
$('#lookbtn').addEventListener('click', () => {
  const box = document.createElement('div');
  box.style.cssText = 'display:flex;flex-direction:column;gap:12px;width:100%';
  const mk = (label, title, fn) => { const b = document.createElement('button'); b.textContent = label; b.title = title;
                                     b.addEventListener('click', fn); return b; };
  const which = document.createElement('div'); which.className = 'gx-row';
  const note = document.createElement('div'); note.style.cssText = 'font-size:12px;opacity:.7';
  const draw = () => {
    glassB.classList.toggle('on', LOOK.mode === 'glass'); charB.classList.toggle('on', LOOK.mode === 'char');
    note.textContent = 'Model: ' + (LOOK.url ? LOOK.url : LOOK.name || BUILTINS[LOOK.builtin] || BUILTINS.frog);
  };
  const glassB = mk('Glass panel', 'The glass panel with the colors behind it', () => setLook('glass').then(draw));
  const charB = mk('3D character', 'A character in place of the panel', () => setLook('char').then(draw));
  which.append(glassB, charB);
  const models = document.createElement('div'); models.className = 'gx-row';
  const pick = document.createElement('input'); pick.type = 'file'; pick.accept = '.vrm,.glb'; pick.hidden = true;
  pick.addEventListener('change', async () => {
    const f = pick.files?.[0]; if (!f) return;
    LOOK.url = ''; ls.set('char-model-url', '');
    await kvSet('char-model', { name: f.name, blob: f });
    await useModel(f, f.name); draw();
  });
  models.append(
    ...Object.entries({ frog: ['🐸 Tree frog', 'A realistic tree frog: wet skin, red eyes that blink from below, a throat that breathes'],
                        glass: ['✨ Glass creature', 'A small iridescent glass creature that takes the live colors'] })
      .map(([k, [label, title]]) => mk(label, title, async () => {
        LOOK.url = ''; ls.set('char-model-url', ''); LOOK.builtin = k; ls.set('char-builtin', k);
        await kvSet('char-model', null); await useModel('builtin:' + k); draw(); })),
    mk('Your model… (.vrm / .glb)', 'A VRM (VRoid Studio…) or a rigged .glb (Ready Player Me, Avaturn, Character Creator…)', () => pick.click()),
    mk('From a URL…', 'A .vrm or .glb on the web (it has to allow other sites to load it: CORS)', async () => {
      const u = prompt('Address of a .vrm or .glb model:', LOOK.url || 'https://');
      if (u === null) return;
      LOOK.url = /^https?:\/\/.+/.test(u.trim()) ? u.trim() : ''; ls.set('char-model-url', LOOK.url);
      await useModel(LOOK.url || await charModel(), ''); draw();
    }), pick);
  box.append(which, models, note); draw();
  GlassUI.alert({ title: 'Look', ok: 'Done', extra: box,
    body: 'Glass can be a panel or a 3D character. The character moves with the same body language, looks at your pointer, ' +
          'blinks, and moves its lips with the voice. Bring your own: a VRM from VRoid Studio, or a rigged .glb with ' +
          'ARKit or Oculus viseme blend shapes for the most realistic lip-sync.' });
});
if (LOOK.mode === 'char') setLook('char', {quiet: true});

/* =========================================================
   barging: talking (or typing) over a reply. What you actually heard is kept;
   the rest fades out on screen and is left out of the conversation.
   ========================================================= */
let turn = null;               // {reply, sentences:[{text,start,end}], playing, cut, msg}
function applyCut(heard, t = turn){
  if (!t) return;
  let cut = null;
  if (heard){
    const i = t.sentences.findIndex((x, k) => k >= Math.max(0, t.playing) && x.text === heard.text);
    const sent = t.sentences[i >= 0 ? i : t.playing];
    if (sent){
      cut = sent.start + Math.round((heard.fraction ?? 1) * (sent.end - sent.start));
      while (cut < sent.end && !/\s/.test(t.reply[cut] || ' ')) cut++;       // finish the word being said
    }
  } else if (t.playing >= 0) cut = t.sentences[t.playing].end;
  if (cut === null || cut >= t.reply.length) return;
  t.cut = cut;
  const heardText = t.reply.slice(0, cut).trimEnd();
  if (t.msg) t.msg.content = heardText + ' … [interrupted]';
  if (t === turn && outText.data.startsWith(heardText.slice(0, 20))){       // still on screen: fade the unheard part
    out.querySelectorAll('.unheard').forEach(e => e.remove());
    outText.data = t.reply.slice(0, cut);
    const u = document.createElement('span'); u.className = 'unheard'; u.textContent = t.reply.slice(cut);
    out.insertBefore(u, caret.parentNode === out ? caret : null);
    fitOut(false);
  }
}

/* typing over the voice turns it down; it comes back when you pause */
let typeDuck = 0;
inp.addEventListener('keydown', e => {
  if (e.key.length !== 1 || !voiceUp() || !(S.vstate === 'speaking' || S.speech)) return;
  if (!typeDuck) vpost({type:'duck', gain:.35});
  clearTimeout(typeDuck);
  typeDuck = setTimeout(() => { typeDuck = 0; vpost({type:'duck', gain:1}); }, 1600);
});

/* =========================================================
   the Glass service: its folder, the hands-free mode, the memory,
   and a heartbeat so the hands-free agent lets this page do the talking
   ========================================================= */
const hfSel = $('#handsfree');
const G = { folder:'', mode:'', canChoose:false };
const MODES = {
  chat:   'When no Glass page is open, Glass listens and answers out loud by itself, and saves the conversation to your folder.',
  record: 'Glass writes down everything it hears into a recording in your folder, and doesn\u2019t answer by itself.',
  off:    'Glass only listens while this page is open.',
};
function showGlass(st){                // the service's state (GET/POST /api/glass)
  if (!st) return;
  if (st.folder && st.folder !== G.folder){
    if (G.folder) logFile = null;      // another folder: the next message starts a new file there
    G.folder = st.folder;
    const name = GlassUI.folderName(st.folder);
    folderBtn.textContent = '📁 ' + name; folderBtn.classList.add('on');
    folderBtn.title = `Conversations, recordings and memory are kept in ${st.folder}`;
    if (!logFile) fileLbl.textContent = `Saving to ${name}. A new file starts with your next message.`;
  }
  if ('can_choose_folder' in st) G.canChoose = !!st.can_choose_folder;
  if (st.mode) showMode(st.mode);
}
function showMode(m){
  G.mode = m;
  if (document.activeElement !== hfSel) hfSel.value = m;
  hfSel.title = `Hands-free: ${hfSel.selectedOptions[0]?.textContent || m}. ${MODES[m] || ''}`;
}
async function chooseGlassFolder(){
  try{
    if (G.canChoose){
      setStatus('Choose a folder in the Finder window…', 'think');
      const r = await GlassUI.api('/api/glass/choose-folder', {});
      setStatus('Ready', 'ok');
      if (r.cancelled || !r.folder) return;
      showGlass(await GlassUI.api('/api/glass'));
    } else {
      const box = fieldBox(), f = field(box, 'Folder', G.folder, '~/Documents/Glass', 'text');
      setTimeout(() => f.focus(), 60);
      if (!await GlassUI.confirm({title:'Where should Glass keep things?', ok:'Use it', extra:box, always:true,
          body:'A folder on the machine running Glass, for your conversations, recordings and memory. It\u2019s made if it doesn\u2019t exist.'})) return;
      const path = f.value.trim();
      if (!path || path === G.folder) return;
      showGlass(await GlassUI.api('/api/glass', {folder:path}));
    }
    S.save = .8; S.kick += .6; ripple(.85, .08, 1.3, 150); cue('tick');
  }catch(e){ fileLbl.textContent = `Couldn't use that folder (${e.message}).`; setStatus('Ready', 'ok'); setMode('error'); shake(); }
}
hfSel.addEventListener('change', async () => {
  const m = hfSel.value, label = hfSel.selectedOptions[0]?.textContent || m;
  if (!await ask(`Hands-free: ${label}?`, MODES[m], 'Switch')){ hfSel.value = G.mode; return; }
  try{
    showGlass(await GlassUI.api('/api/glass', {mode:m}));
    setStatus(`Hands-free: ${label}`, 'ok'); cue('tick'); S.kick += .7; ripple(.6, .08, 1.2, S.hue + 90);
  }catch(e){ hfSel.value = G.mode; setStatus(`Couldn't switch (${e.message})`, 'err'); shake(); }
});
/* [[remember: a fact]], anywhere in a reply (the memory prompt asks for it): taken out before
   anything is shown, spoken, kept or logged. A tag can arrive split across chunks, so an
   unfinished one waits for the next chunk. */
function makeRemember(){
  const TAG = /\s*\[\[\s*remember\s*:([\s\S]*?)\]\]/gi;
  const facts = [];
  let hold = '';
  const keep = f => { f = f.replace(/\s+/g, ' ').trim(); if (f) facts.push(f); };
  const unfinished = tail => {                     // could `tail` ("[[rem", "[[remember: my na") still become a tag?
    if (tail.length > 600 || tail.includes(']]')) return false;
    const t = tail.slice(2).replace(/^\s+/, '').toLowerCase();
    return 'remember'.startsWith(t) || /^remember\s*(:|$)/.test(t);
  };
  return {
    facts,
    push(chunk){
      let s = hold + chunk; hold = '';
      s = s.replace(TAG, (_, f) => { keep(f); return ''; });
      const open = s.lastIndexOf('[[');
      if (open >= 0 && unfinished(s.slice(open))){
        let at = open; while (at > 0 && /\s/.test(s[at - 1])) at--;   // with the space before it
        hold = s.slice(at); s = s.slice(0, at);
      } else if (s.endsWith('[')){ hold = '['; s = s.slice(0, -1); }
      return s;
    },
    flush(){                                        // the reply ended inside a tag: keep what it said
      const s = hold; hold = '';
      const m = /^\s*\[\[\s*remember\s*:([\s\S]*)$/i.exec(s);
      if (m){ keep(m[1].replace(/\]$/, '')); return ''; }
      return s;
    },
  };
}
async function rememberFacts(facts){
  for (const f of facts){
    try{
      const r = await GlassUI.api('/api/memory', {add:f});
      if (r.added){ setStatus(`Remembered: ${f}`, 'ok'); cue('tick'); S.save = Math.max(S.save, .8); ripple(.5, .3, 1, 150); }
    }catch(e){ console.warn('remembering failed', e); }
  }
}
async function beat(){                 // while this page pings, the hands-free agent lets it answer
  try{
    const r = await GlassUI.api('/api/glass/page', {id:tabId});
    if (!G.folder) showGlass(await GlassUI.api('/api/glass'));   // the service came (back) up
    else if (r.mode) showMode(r.mode);
  }catch{}
}
async function glassInit(){
  hfSel.hidden = false;
  folderBtn.textContent = '📁 …';
  try{ showGlass(await GlassUI.api('/api/glass')); }
  catch(e){ fileLbl.textContent = `Can't reach the Glass service (${e.message}). Chats aren't saved yet.`; }
  beat(); setInterval(beat, 5000);
  addEventListener('pagehide', () => GlassUI.api('/api/glass/page', {id:tabId, leaving:true}).catch(() => {}));   // hands-free takes over now
  addEventListener('focus', () => GlassUI.api('/api/glass').then(showGlass, () => {}));   // changed from the menu bar?
}

/* go */
let health = {};                      // the voice service's /api/health ({} while it isn't answering)
function applyHost(){
  host = GlassUI.ollamaUrl(); vbase = GlassUI.voiceUrl();
}
async function vhealth(){
  try{ const r = await fetch(vbase + '/api/health'); health = r.ok ? await r.json() : {}; }catch{ health = {}; }
  return health;
}
async function boot(){
  applyHost();
  vinit(await vhealth());
  loadModels();
}
fitIn();
GLASS ? glassInit() : restoreFolder();
claim();
boot();
inp.focus();
</script>
